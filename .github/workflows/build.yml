name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find PisoTab ZIP
        run: |
          ZIP="PisoTab_JTechStyle_v1.7_ControlledKiosk_HomeLauncher_Whitelist_RecommendedApps_BUILD_APK.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: PisoTab ZIP not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using: $ZIP"

      - name: Extract PisoTab project
        run: |
          rm -rf build_project
          mkdir -p build_project

          unzip -o \
            "PisoTab_JTechStyle_v1.7_ControlledKiosk_HomeLauncher_Whitelist_RecommendedApps_BUILD_APK.zip" \
            -d build_project

          echo "Extracted project:"
          find build_project -maxdepth 4 -type f | sort

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find build_project \
            -type f \
            -name "settings.gradle.kts" -o -name "settings.gradle" \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project
        run: |
