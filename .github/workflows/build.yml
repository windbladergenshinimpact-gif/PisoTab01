name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check ZIP
        run: |
          test -f "PisoTab_NonDeviceOwner_AdminLauncher_FileControl_AccessibilityGuard_Stronger_BUILD_APK.zip"

      - name: Extract PisoTab
        run: |
          rm -rf build_project
          mkdir -p build_project

          unzip -o \
            "PisoTab_NonDeviceOwner_AdminLauncher_FileControl_AccessibilityGuard_Stronger_BUILD_APK.zip" \
            -d build_project

      - name: Find Android Project
        run: |
          PROJECT_FILE=$(find build_project -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print | head -n 1)

          if [ -z "$PROJECT_FILE"
