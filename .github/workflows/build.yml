name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract PisoTab Project
        run: |
          rm -rf build_project
          mkdir -p build_project
          unzip -o "PisoTab_NonDeviceOwner_AdminLauncher_FileControl_AccessibilityGuard_Stronger_FIXED_BUILD_APK.zip" -d build_project

      - name: Verify Android Project
        run: |
          echo "Checking project..."

          if [ ! -f "build_project/project/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find build_project -maxdepth 5 -type f -print
            exit 1
          fi

          if [ ! -d "build_project/project/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "Android project found:"
          ls -la build_project/project
          ls -la build_project/project/app

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          cd build_project/project
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find build_project/project/app/build/outputs -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find build_project/project/app/build/outputs -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" release/PisoTab-debug.apk

          echo "Final APK:"
          ls -lh release/PisoTab-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-APK
          path: release/PisoTab-debug.apk
