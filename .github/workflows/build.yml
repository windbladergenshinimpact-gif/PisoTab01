name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check ZIP
        run: test -f "PisoTab_NonDeviceOwner_AdminLauncher_FileControl_AccessibilityGuard_Stronger_BUILD_APK.zip"

      - name: Extract ZIP
        run: |
          rm -rf build_project
          mkdir build_project
          unzip -o "PisoTab_NonDeviceOwner_AdminLauncher_FileControl_AccessibilityGuard_Stronger_BUILD_APK.zip" -d build_project

      - name: Find Project
        run: |
          PROJECT_DIR=""
          for DIR in $(find build_project -type d); do
            if [ -f "$DIR/settings.gradle" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
            if [ -f "$DIR/settings.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found."
            find build_project -type f -print
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find "$PROJECT_DIR/app/build/outputs" -type f -name "*.
