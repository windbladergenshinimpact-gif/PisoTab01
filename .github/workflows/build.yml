name: Build PisoTab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract source
        run: unzip -q PisoTab_NonDeviceOwner_AdminLauncher_HomeLauncher_TopCorner_Timer_v4_FIXED_SOURCE.zip -d source

      - name: Build APK
        run: |
          PROJECT=$(find source -name settings.gradle.kts -print -quit)
          PROJECT_DIR=$(dirname "$PROJECT")
          cd "$PROJECT_DIR"
          gradle clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-FIXED-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
