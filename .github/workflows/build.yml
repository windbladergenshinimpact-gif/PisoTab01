name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Check Android project
        run: |
          echo "Checking project files..."
          ls -la

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found in repository root."
            echo "Make sure the Android project and Gradle wrapper are committed."
            exit 1
          fi

          chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files generated:"
          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "Found APK: $APK"

          mkdir -p release
          cp "$APK" release/PisoTab-debug.apk

      - name: Upload PisoTab APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-APK
          path: release/PisoTab-debug.apk
          if-no-files-found: error
