name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract PisoTab
        run: |
          rm -rf build_project
          mkdir -p build_project
          unzip -o PisoTab_DeepFreezeStyle_AllowedApps_DeviceOwner_ResetProtection_AppSwitching_BUILD_APK.zip -d build_project

          echo "Extracted files:"
          find build_project -maxdepth 5 -type f -print

      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find build_project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build PisoTab
        run: |
          cd "$PROJECT_DIR"

          set +e
          gradle clean assembleDebug --stacktrace 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}

          echo "===== COMPILATION ERRORS ====="
          grep -n -E "e: |error: |Unresolved reference|Expecting|Type mismatch|Cannot access" build.log || true

          echo "===== BUILD STATUS ====="
          echo "$STATUS"

          exit "$STATUS"

      - name: Find APK
        if: ${{ success() }}
        run: |
          echo "Searching for APK..."
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Collect APK
        if: ${{ success() }}
        run: |
          mkdir -p release

          APK=$(find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" release/PisoTab-debug.apk

          echo "APK:"
          ls -lh release/PisoTab-debug.apk

      - name: Upload APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-APK
          path: release/PisoTab-debug.apk
          if-no-files-found: error
