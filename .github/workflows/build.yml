name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check PisoTab ZIP
        run: |
          ZIP="PisoTab_JTechStyle_v1.7_ControlledKiosk_HomeLauncher_Whitelist_RecommendedApps_BUILD_APK.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found:"
            echo "$ZIP"
            echo
            echo "Available ZIP files:"
            ls -lh *.zip 2>/dev/null || true
            exit 1
          fi

          echo "Found PisoTab ZIP:"
          ls -lh "$ZIP"

      - name: Extract PisoTab
        run: |
          rm -rf build_project
          mkdir -p build_project

          unzip -o \
            "PisoTab_JTechStyle_v1.7_ControlledKiosk_HomeLauncher_Whitelist_RecommendedApps_BUILD_APK.zip" \
            -d build_project

          echo
          echo "Extracted contents:"
          ls -la build_project

          echo
          echo "Project contents:"
