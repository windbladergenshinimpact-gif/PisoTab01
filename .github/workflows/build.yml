name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract PisoTab Project
        run: |
          rm -rf build_project
          mkdir -p build_project

          unzip -o \
            PisoTab_DeepFreezeStyle_AllowedApps_DeviceOwner_ResetProtection_AppSwitching_BUILD_APK.zip \
            -d build_project

          echo "Extracted files:"
          find build_project -maxdepth 5 -type f -print

      - name: Locate Android Project
        run: |
          PROJECT_DIR=$(find build_project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP."
            echo ""
            echo "Directories:"
            find build_project -maxdepth 5 -type d -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android Project
        run: |
          echo "Project directory:"
          ls -la "$PROJECT_DIR"

          test -d "$PROJECT_DIR/app"

          echo "Android project verified."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build PisoTab APK
        run: |
          cd "$PROJECT_DIR"

          echo "Building PisoTab..."
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for generated APK..."

          APK=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."

            echo ""
            echo "Build output:"
            find "$PROJECT_DIR/app/build" \
              -maxdepth 10 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release
          cp "$APK" release/PisoTab-debug.apk

          echo ""
          echo "Final APK:"
          ls -lh release/PisoTab-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-APK
          path: release/PisoTab-debug.apk
          if-no-files-found: error
