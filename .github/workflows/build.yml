name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

      - name: Check ZIP
        run: |
          if [ ! -f "PisoTab_JTechStyle_v1.7_ControlledKiosk.zip" ]; then
            echo "ERROR: PisoTab_JTechStyle_v1.7_ControlledKiosk.zip was not found."
            echo "Available ZIP files:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o "PisoTab_JTechStyle_v1.7_ControlledKiosk.zip" -d extracted

      - name: Show extracted files
        run: |
          echo "Extracted contents:"
          find extracted -maxdepth 4 -type f | sort

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: extracted/project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-APK
          path: extracted/project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
