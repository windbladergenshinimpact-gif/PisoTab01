name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate Android Project
        run: |
          PROJECT_DIR=""
          for DIR in $(find . -type d); do
            if [ -f "$DIR/settings.gradle" ] || [ -f "$DIR/settings.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find . -maxdepth 6 -type f -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release
          APK=$(find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          cp "$APK" release/PisoTab-debug.apk
          ls -lh release/PisoTab-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-APK
          path: release/PisoTab-debug.apk
