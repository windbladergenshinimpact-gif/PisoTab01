      - name: Build PisoTab APK
        run: |
          cd "$PROJECT_DIR"

          echo "Building PisoTab..."
          gradle clean assembleDebug --stacktrace

      - name: Find and prepare APK
        run: |
          echo "Searching entire workspace for APK files..."

          find "$GITHUB_WORKSPACE" -type f -name "*.apk" -print

          APK=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: NO APK WAS GENERATED."
            echo
            echo "Gradle build directory:"
            find "$PROJECT_DIR/app/build" -maxdepth 8 -type f -print 2>/dev/null || true
            echo
            echo "All build directories:"
            find "$PROJECT_DIR" -maxdepth 5 -type d -name "build" -print
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/PisoTab-debug.apk"

          echo "Prepared:"
          ls -lh "$GITHUB_WORKSPACE/release/PisoTab-debug.apk"

      - name: Upload PisoTab APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-APK
          path: release/PisoTab-debug.apk
          if-no-files-found: error
