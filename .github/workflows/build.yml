name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract PisoTab
        run: |
          rm -rf build_project
          mkdir -p build_project

          unzip -o \
            PisoTab_DeepFreezeStyle_AllowedApps_DeviceOwner_ResetProtection_AppSwitching_BUILD_APK.zip \
            -d build_project

          echo "Extracted files:"
          find build_project -maxdepth 5 -type f -print

      - name: Locate Android
