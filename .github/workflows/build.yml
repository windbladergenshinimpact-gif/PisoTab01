name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract PisoTab project
        run: |
          rm -rf build_project
          mkdir -p build_project
          unzip -o "PisoTab_NonDeviceOwner_AdminLauncher_ActualAPK_Whitelist_Launcher_FIXED_BUILD_APK.zip" -d build_project

      - name: Find project
        run: |
          if [ -f build_project/project/settings.gradle.kts ]; then
            echo "PROJECT_DIR=build_project/project" >> "$GITHUB_ENV"
          elif [ -f build_project/project/settings.gradle ]; then
            echo "PROJECT_DIR=build_project/project" >> "$GITHUB_ENV"
          else
            echo "ERROR: Android project not found"
            find build_project -maxdepth 5 -type f -print
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
