name: Build PisoTab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Extract PisoTab
        run: |
          rm -rf build_project
          mkdir -p build_project
          unzip -o "PisoTab_NonDeviceOwner_AdminLauncher_ActualAPK_Whitelist_Launcher_PACKAGE_VISIBILITY_FIXED_BUILD_APK.zip" -d build_project

      - name: Check Android project
        run: |
          test -f build_project/project/settings.gradle.kts
          test -d build_project/project/app
          echo "Android project found."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          cd build_project/project
          gradle clean assembleDebug --stacktrace

      - name: Check generated APK
        run: |
          test -f build_project/project/app/build/outputs/apk/debug/app-debug.apk
          ls -lh build_project/project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PisoTab-APK
          path: build_project/project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
